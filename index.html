                    <h2 class="section__header__title">
                      Efiopiya Federativ Demokratik Respublikasının Baş naziri
                      Abiy Əhməd Əli “AI Academy” tədris mərkəzini ziyarət edib
                    </h2>
                    <p class="section__header__desc">3 mart 2026</p>
                  </div>
                </div>
                <div
                  class="section__body InnovationsDetailsBody_ai-content__cjJWX"
                >
                  <p>
                    <strong>
                      <img
                        alt=""
                        src="assets/deYUdTsQHyplFuuz5aaUXzMShQSNXgY8kR1G7HTA.jpg"
                      />
                    </strong>
                  </p>
                  <p dir="ltr">
                    Efiopiya Federativ Demokratik Respublikasının Baş naziri
                    Abiy Əhməd Əlinin Azərbaycana rəsmi səfəri çərçivəsində
                    AZCON Holding şirkətlərindən olan Milli Süni İntellekt
                    Mərkəzinin “AI Academy” tədris mərkəzinə ziyarəti baş tutub.
                  </p>
                  <p dir="ltr">
                    Ziyarətdə Azərbaycan Respublikasının rəqəmsal inkişaf və
                    nəqliyyat naziri Rəşad Nəbiyev də iştirak edib. Nazir süni
                    intellektin ölkənin rəqəmsal inkişaf gündəliyində strateji
                    prioritet kimi müəyyən olunduğunu vurğulayaraq, insan
                    kapitalının hazırlanması və texnoloji imkanların
                    genişləndirilməsinin milli inkişaf modelinin əsas
                    komponentlərindən biri olduğunu qeyd edib.
                  </p>
                  <p dir="ltr">
                    Milli Süni İntellekt Mərkəzinin baş direktoru Tuncay Bağırov
                    qonaqlara Akademiyanın yaradılma məqsədi, fəaliyyət
                    istiqamətləri və inkişaf planları barədə məlumat verib.
                    Bildirilib ki, “AI Academy” Azərbaycan Respublikasının
                    2025–2028-ci illər üçün Süni İntellekt Strategiyasına uyğun
                    olaraq ölkədə yüksəkixtisaslı mütəxəssis hazırlığının
                    sistemli şəkildə təşkili, dövlət və özəl sektor üçün
                    tətbiqyönümlü bacarıqların inkişaf etdirilməsi və innovasiya
                    mühitinin gücləndirilməsi məqsədilə fəaliyyət göstərir.
                  </p>
                  <p dir="ltr">
                    Qonaqlara Akademiyanın tədris proqramları, ixtisaslaşmış
                    kursları və praktiki təlim modulları təqdim olunub, tədris
                    prosesinin real layihələrə əsaslanan model üzrə qurulduğu
                    diqqətə çatdırılıb. Bu yanaşmanın süni intellekt
                    texnologiyalarının yalnız nəzəri bilik səviyyəsində deyil,
                    konkret iqtisadi və institusional tətbiqlər vasitəsilə dəyər
                    yaratmasına xidmət etdiyi bildirilib.
                  </p>
                  <p dir="ltr">
                    Görüş zamanı süni intellekt sahəsinə beynəlxalq əməkdaşlığın
                    genişləndirilməsi, bilik və təcrübə mübadiləsinin təşviqi,
                    eləcə də bu istiqamətdə birgə təşəbbüslərin inkişaf
                    etdirilməsi məsələləri müzakirə olunub.
                  </p>

                    <h2 class="section__header__title">
                      Azərbaycan 2025-ci ildə süni intellektə hazırlıq
                      səviyyəsinə görə ən yüksək irəliləyiş əldə edən ölkələrdən

                    </h2>
                    <p class="section__header__desc">5 yanvar 2026</p>

                <div
                  class="section__body InnovationsDetailsBody_ai-content__cjJWX"
                >
                  <p dir="ltr">
                    “Oxford Insights” beynəlxalq tədqiqat mərkəzinin yayımladığı
                    “Hökumətin Süni İntellektə Hazırlıq İndeksi”
                    (Hökumətin Süni İntellektə Hazırlıq İndeksi 2025)
                    hesabatına əsasən, Azərbaycan süni
                    intellektə hazırlıq səviyyəsinə görə mühüm irəliləyiş əldə
                    edib. Ölkəmiz bir il ərzində 111-ci yerdən 70-ci yerə
                    yüksəlib. Beləliklə, Azərbaycan 2025-ci ildə ən sürətli
                    irəliləyişə nail olaraq illik müqayisədə ən böyük artım
                    qeydə alınan ölkələrdən biridir.
                  </p>
                  <p dir="ltr">
                    Hesabata əsasən, Azərbaycanın ümumi balı 48,96 təşkil edib
                    ki, bu da Cənubi və Mərkəzi Asiya regionu üzrə orta
                    göstərici hesab olunan 41,4 balı üstələyir.  Müqayisə üçün
                    qeyd edək ki, 2024-cü ildə bu göstərici 39,92 olub. Eyni
                    zamanda Azərbaycan Cənubi Qafqaz ölkələri arasında ən yüksək
                    nəticə göstərib.
                  </p>
                  <p dir="ltr">
                    Bu nəticə Azərbaycanın dövlət idarəçiliyində rəqəmsallaşma
                    proseslərinin sürətləndirilməsi, süni intellekt
                    texnologiyalarının tətbiqi, rəqəmsal infrastrukturun
                    gücləndirilməsi və innovasiya ekosisteminin inkişafı
                    istiqamətində atdığı ardıcıl addımların göstəricisidir.
                  </p>
                  <p dir="ltr">
                    Hesabatda qeyd olunur ki, Cənubi və Mərkəzi Asiya ölkələri
                    e-hökumət xidmətlərinin genişləndirilməsi, hesablama gücünün
                    artırılması, yerli innovasiya mühitinin formalaşdırılması və
                    insan kapitalına yatırımlar hesabına süni intellektə
                    hazırlıq səviyyəsini gücləndirir. Azərbaycanın qlobal
                    reytinqdə sürətli yüksəlişi də bu regional tendensiyanın
                    mühüm nümunələrindən biri kimi dəyərləndirilir.
                  </p>
                  <p dir="ltr">
                    Eyni zamanda vurğulanır ki, dövlət sektorunda süni intellekt
                    texnologiyalarının tətbiqi, rəqəmsal infrastrukturun
                    inkişafı və innovasiya ekosistemlərinin gücləndirilməsi
                    region ölkələrinin irəliləyişinə təkan verən əsas
                    amillərdir. Azərbaycanın regional sıralamada ön mövqelərdən
                    birində yer alması bu ümumi inkişaf xəttinin bariz
                    göstəricisi hesab olunur. Bu kontekstdə AZCON Holding
                    şirkətlərindən olan Milli Süni İntellekt Mərkəzinin
                    fəaliyyətinin genişləndirilməsi, dövlət qurumları arasında
                    koordinasiyanın gücləndirilməsi, insan kapitalının inkişafı
                    və milli Süni İntellekt (Sİ) platformalarının
                    formalaşdırılması istiqamətində görülən işlər ölkənin süni
                    intellekt üzrə institusional potensialının möhkəmlənməsinə
                    töhfə verir.
                  </p>
                  <p dir="ltr">
                    Belə ki, “Azərbaycan Respublikasının 2025 – 2028-ci illər
                    üçün Süni İntellekt Strategiyası” çərçivəsində süni
                    intellektin dövlət idarəçiliyində tətbiqi, məlumat əsaslı
                    qərarvermə, Sİ infrastrukturunun inkişafı və sektorlar üzrə
                    Sİ transformasiyası əsas prioritetlər kimi müəyyən edilib.
                    Bu strateji yanaşma Azərbaycanın süni intellektə əsaslanan
                    dövlət xidmətlərini genişləndirməyə, innovativ həllərin
                    tətbiqini sürətləndirməyə və qlobal mövqeyini gücləndirməyə
                    imkan yaradır.
                    <strong
                      id="docs-internal-guid-2537be76-7fff-e875-c491-35c23022cbfe"
                    >
                    </strong>
                  </p>

                    <h2 class="section__header__title">
                      “Mediada Süni İntellekt” mövzusunda vörkşop keçirilib
                    </h2>
                    <p class="section__header__desc">29 dekabr 2025</p>
                  </div>
                </div>
                <div
                  class="section__body InnovationsDetailsBody_ai-content__cjJWX"
                >
                  <p>
                    AZCON Holding şirkətlərindən olan Milli Süni İntellekt
                    Mərkəzinin təşkilatçılığı ilə media nümayəndələri üçün
                    “Mediada Süni İntellekt” mövzusunda vörkşop keçirilib.
                    Tədbir Milli Süni İntellekt Mərkəzinin süni intellekt üzrə
                    məzmun yaradıcısı Məmməd Qurbanovun təqdimatı ilə baş tutub.
                  </p>
                  <p>
                    Vörkşop çərçivəsində iştirakçılara süni intellektin media
                    sahəsində tətbiq imkanları, jurnalistika və rəqəmsal mediada
                    Sİ əsaslı alətlərin istifadəsi, eləcə də süni intellekt
                    vasitəsilə məzmun yaradılmasının praktik yolları təqdim
                    olunub. Təlim zamanı mətn, vizual və video kontent
                    istehsalında süni intellekt alətlərinin effektiv istifadəsi,
                    iş proseslərinin sürətləndirilməsi və keyfiyyətin
                    artırılması mövzularına xüsusi diqqət yetirilib.
                  </p>
                  <p>
                    Tədbir interaktiv formatda keçirilib, media nümayəndələri
                    real nümunələr üzərində praktiki tapşırıqlar yerinə yetirib
                    və mövzu ilə bağlı suallarını ünvanlayıblar. Vörkşopun əsas
                    məqsədi media əməkdaşlarının süni intellekt texnologiyaları
                    ilə bağlı bilik və bacarıqlarını artırmaq, onları müasir
                    rəqəmsal trendlərə uyğunlaşdırmaq olub.
                  </p>
                  <p>
                    Milli Süni İntellekt Mərkəzi gələcəkdə də media və müxtəlif
                    sahələr üçün süni intellekt mövzusunda maarifləndirici təlim
                    və tədbirlərin keçirilməsini planlaşdırır. Bu təşəbbüslərin
                    əsas məqsədi media nümayəndələrinin süni intellekt
                    alətlərindən düzgün, etik və effektiv şəkildə istifadə
                    etmələrini təmin etmək, peşəkar fəaliyyətlərində bu
                    texnologiyaların imkanlarından səmərəli yararlanmalarına
                    dəstək olmaqdır.
                  </p>
